name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Smoke run of the full pipeline
        run: rde run --config configs/small.yaml --artifacts /tmp/artifacts --reports /tmp/reports
      - name: Smoke run of the triage evaluation harness (offline, no API calls)
        run: rde triage-eval --config configs/small.yaml --backend heuristic --n 0 --out /tmp/triage
      - name: Smoke run of the monitoring study
        run: rde monitor --config configs/monitoring_small.yaml --out /tmp/monitoring

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (small config for speed)
        run: docker build --build-arg RDE_CONFIG=configs/small.yaml -t rde:ci .
      - name: Start container and call the API
        run: |
          docker run -d --name rde -p 8000:8000 rde:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/decisions \
            -H 'content-type: application/json' -d @examples/purchase.json | tee /tmp/out.json
          python3 -c "import json; d=json.load(open('/tmp/out.json')); assert d['decision'] in {'approve','review','decline'}"
      - name: Logs on failure
        if: failure()
        run: docker logs rde
