# Default experiment. Every value here is an explicit assumption, not a measured fact.
simulation:
  seed: 7
  start: "2026-01-01"
  n_days: 120
  n_users: 15000
  n_sources: 40
  n_bad_sources: 3
  new_user_share: 0.3
  # fraud intensities per 10,000 users per day
  card_testing_campaigns_per_10k_users_day: 0.25
  ato_incidents_per_10k_users_day: 1.6
  bot_campaigns_per_10k_users_day: 0.16
  friendly_fraud_rate: 0.002

split:            # days from simulation start, end-exclusive
  train_end_day: 75
  valid_end_day: 90
  calib_end_day: 105

model:
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  num_boost_round: 2000
  early_stopping_rounds: 100
  seed: 7

policy:
  review_capacity: 0.02   # max share of events analysts can review
  costs:                  # illustrative unit economics in USD; replace with your own
    purchase:
      approve_fraud_fixed: 15.0        # chargeback fee + handling
      approve_fraud_amount_rate: 1.0   # the whole amount is lost
      decline_legit_fixed: 5.0         # support contact, churn risk
      decline_legit_amount_rate: 0.3   # lost margin on the order
      review_fixed: 3.0                # analyst time
      review_legit_fixed: 1.0          # delay friction for a good customer
      review_fraud_catch_rate: 0.9
    signup:
      approve_fraud_fixed: 2.5         # acquisition payout for a fake signup
      approve_fraud_amount_rate: 0.0
      decline_legit_fixed: 6.0         # value of a lost genuine customer
      decline_legit_amount_rate: 0.0
      review_fixed: 1.5
      review_legit_fixed: 0.5
      review_fraud_catch_rate: 0.9
