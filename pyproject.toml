[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-decisioning-engine"
version = "0.1.0"
description = "Cost-aware fraud risk decisioning: synthetic events, point-in-time features, calibrated LightGBM, approve/review/decline policy, FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Santiago Cartagena" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
rde = "rde.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
